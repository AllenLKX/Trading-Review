<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#051425" />
    <title>RationalTrade · 暂时离线</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #051425; color: #d8e2f3; font-family: system-ui, sans-serif; }
      main { width: min(100%, 360px); border: 1px solid #2a3b50; border-radius: 8px; padding: 24px; background: #0b1c2f; }
      h1 { margin: 0; color: white; font-size: 20px; letter-spacing: 0; }
      p { margin: 12px 0 0; color: #9fb0c8; font-size: 14px; line-height: 1.7; }
      button { width: 100%; height: 44px; margin-top: 20px; border: 0; border-radius: 8px; background: #5447e8; color: white; font-size: 14px; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <h1>当前网络不可用</h1>
      <p>交易数据不会在离线页面中缓存或修改。网络恢复后重新连接服务器。</p>
      <button type="button" onclick="location.reload()">重新连接</button>
    </main>
  </body>
</html>
